<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Quote Template</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg-1: #0f0c20;
      --bg-2: #171327;
      --pink: #ec4899;
      --pink-soft: #f472b6;
      --purple: #a855f7;
      --white: #f8fafc;
      --line: rgba(255, 255, 255, 0.12);
    }

    html, body {
      margin: 0;
      min-height: 100vh;
      width: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at top, rgba(168, 85, 247, 0.18), transparent 30%),
        radial-gradient(circle at bottom, rgba(236, 72, 153, 0.16), transparent 35%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    .card {
      position: relative;
      width: min(92vw, 500px);
      padding: 42px 30px 28px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.52),
        0 0 30px rgba(236, 72, 153, 0.14),
        inset 0 1px 0 rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
      animation: floatCard 5s ease-in-out infinite;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(236,72,153,0.08), transparent 40%, rgba(168,85,247,0.08));
      pointer-events: none;
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .quote-mark {
      position: absolute;
      top: 14px;
      left: 22px;
      font-size: 64px;
      line-height: 1;
      color: var(--pink);
      opacity: 0.4;
      font-weight: 700;
      user-select: none;
      text-shadow: 0 0 16px rgba(236, 72, 153, 0.5);
    }

    .message-body {
      position: relative;
      z-index: 1;
      margin-top: 24px;
      color: var(--white);
      font-size: 1.08rem;
      line-height: 1.85;
      letter-spacing: 0.3px;
    }

    .message-body p {
      margin: 10px 0;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeInText 1.2s ease forwards;
    }

    .highlight {
      color: var(--pink-soft);
      font-weight: 700;
      text-shadow: 0 0 12px rgba(244, 114, 182, 0.35);
    }

    .footer-line {
      position: relative;
      z-index: 1;
      margin-top: 22px;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--pink), transparent);
      opacity: 0.9;
    }

    @keyframes fadeInText {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 34px 22px 22px;
      }

      .message-body {
        font-size: 0.97rem;
        line-height: 1.7;
      }

      .quote-mark {
        left: 16px;
        top: 12px;
        font-size: 52px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="quote-mark">“</div>
    <div class="message-body" id="message-body"></div>
    <div class="footer-line"></div>
  </div>

  <script>
    // Edit this data to customize your message.
    const cardData = {
      lines: [
        "Toh ja na, karna kisi aur ko request...",
        "Main kehti hoon kya ki tum mere paas aao? <span class='highlight'>Haan?</span>",
        "Ja kisi aur ke paas kar le. Ok!",
        "Main nahin kehti ki mere aage haath jod.",
        "Jo karna hai ja kar le, jiske saath karna uske saath kar.",
        "Maine kya mana kar rakha hai tujhe?",
        "Kisi aur ko itna request karta na, pura jism khol kar dikha deti tujhe."
      ]
    };

    const messageBody = document.getElementById('message-body');

    cardData.lines.forEach((line, index) => {
      const para = document.createElement('p');
      para.innerHTML = line;
      para.style.animationDelay = `${index * 0.15}s`;
      messageBody.appendChild(para);
    });
  </script>
</body>
</html>
